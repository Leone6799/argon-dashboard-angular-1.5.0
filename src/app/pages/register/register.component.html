<div class="header bg-gradient-primary py-7 py-lg-8">
  <div class="container">
    <div class="header-body text-center mb-7">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <h1 class="text-white">Criar conta</h1>
          <p class="text-lead text-light">
            Cadastre-se no AgendaFit para agendar suas consultas nutricionais.
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="separator separator-bottom separator-skew zindex-100">
    <svg
      x="0"
      y="0"
      viewBox="0 0 2560 100"
      preserveAspectRatio="none"
      version="1.1"
      xmlns="http://www.w3.org/2000/svg"
    >
      <polygon class="fill-default" points="2560 0 2560 100 0 100"></polygon>
    </svg>
  </div>
</div>

<div class="container mt--8 pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card bg-secondary shadow border-0">
        <div class="card-body px-lg-5 py-lg-5">
          <div class="text-center text-muted mb-4">
            <small>Preencha seus dados para criar sua conta</small>
          </div>

          <div *ngIf="mensagem" class="alert alert-danger">
            {{ mensagem }}
          </div>

          <form role="form" (ngSubmit)="cadastrar()">
            <div class="form-group">
              <div class="input-group input-group-alternative mb-3">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="ni ni-hat-3"></i>
                  </span>
                </div>

                <input
                  class="form-control"
                  placeholder="Nome completo"
                  type="text"
                  name="nome"
                  [(ngModel)]="nome"
                />
              </div>
            </div>

            <div class="form-group">
              <div class="input-group input-group-alternative mb-3">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="ni ni-single-02"></i>
                  </span>
                </div>

                <div class="form-group">
  <div class="input-group input-group-alternative mb-3">
    <div class="input-group-prepend">
      <span class="input-group-text">
        <i class="ni ni-calendar-grid-58"></i>
      </span>
    </div>

    <input
      class="form-control"
      placeholder="Data de nascimento"
      type="date"
      name="dataNascimento"
      [(ngModel)]="dataNascimento"
    />
  </div>
</div>
              </div>
            </div>

            <div class="form-group">
              <div class="input-group input-group-alternative mb-3">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="ni ni-email-83"></i>
                  </span>
                </div>

                <input
                  class="form-control"
                  placeholder="E-mail"
                  type="email"
                  name="email"
                  [(ngModel)]="email"
                />
              </div>
            </div>

            <div class="form-group">
  <div class="input-group input-group-alternative mb-3">
    <div class="input-group-prepend">
      <span class="input-group-text">
        <i class="ni ni-mobile-button"></i>
      </span>
    </div>

    <input
      class="form-control"
      placeholder="Telefone"
      type="text"
      name="telefone"
      maxlength="15"
      [(ngModel)]="telefone"
      (input)="aplicarMascaraTelefone()"
    />
  </div>
</div>

            <div class="form-group">
              <div class="input-group input-group-alternative mb-3">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="ni ni-lock-circle-open"></i>
                  </span>
                </div>

                <input
                  class="form-control"
                  placeholder="Senha"
                  type="password"
                  name="senha"
                  [(ngModel)]="senha"
                />
              </div>
            </div>

            <div class="form-group">
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="ni ni-lock-circle-open"></i>
                  </span>
                </div>

                <input
                  class="form-control"
                  placeholder="Confirmar senha"
                  type="password"
                  name="confirmarSenha"
                  [(ngModel)]="confirmarSenha"
                />
              </div>
            </div>

            <div class="text-center">
              <button
                type="submit"
                class="btn btn-primary mt-4"
                [disabled]="carregando"
              >
                {{ carregando ? 'Cadastrando...' : 'Cadastrar' }}
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-12 text-center">
          <a routerLink="/auth/login" class="text-light">
            <small>Já tenho uma conta</small>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
