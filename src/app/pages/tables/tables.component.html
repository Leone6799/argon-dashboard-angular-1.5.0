<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8">
  <div class="container-fluid">
    <div class="header-body">
    </div>
  </div>
</div>

<div class="container-fluid mt--7">
  <div class="row">
    <div class="col">
      <div class="card shadow">
        <div class="card-header border-0">
          <h3 class="mb-0">Painel de Consultas</h3>
        </div>
        <div class="table-responsive">
          <table class="table align-items-center table-flush">
            <thead class="thead-light">
              <tr>
                <th scope="col">Paciente</th>
                <th scope="col">Data e Horário</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-right">Ação</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let consulta of consultas">
                
                <th scope="row">
                  <div class="media align-items-center">
                    <div class="media-body">
                      <span class="mb-0 text-sm font-weight-bold d-block">
                        {{ consulta.paciente?.nome || 'Paciente não identificado' }}
                      </span>
                      <small class="text-muted">
                        {{ consulta.paciente?.telefone || 'Sem telefone salvo' }}
                      </small>
                    </div>
                  </div>
                </th>
                
                <td>
                  {{ consulta.horario?.dataHora | date:'dd/MM/yyyy HH:mm' }}
                </td>
                
                <td>
                  <span class="badge badge-dot mr-4">
                    <i [ngClass]="{
                      'bg-warning': consulta.status === 'PENDENTE', 
                      'bg-success': consulta.status === 'CONFIRMADA', 
                      'bg-danger': consulta.status === 'CANCELADA'
                    }"></i> 
                    {{ consulta.status }}
                  </span>
                </td>
                
                <td class="text-right">
                  <button 
                    class="btn btn-sm btn-success"
                    [disabled]="!consulta.paciente?.telefone"
                    (click)="abrirConversaWhatsApp(consulta.paciente?.telefone, consulta.paciente?.nome)">
                    <i class="fab fa-whatsapp mr-1"></i> Contatar
                  </button>
                </td>

              </tr>
              
              <tr *ngIf="consultas?.length === 0">
                <td colspan="4" class="text-center py-4 text-muted">
                  Nenhum agendamento encontrado no sistema.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer py-4">
        </div>
      </div>
    </div>
  </div>
</div>
